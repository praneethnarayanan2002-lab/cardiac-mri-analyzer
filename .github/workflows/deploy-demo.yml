# Builds the static demo (frontend in static mode + the files in frontend/public/demo/) and publishes
# it to GitHub Pages. No Python, data or model weights are needed here: everything the demo shows was
# exported locally by `make demo` and committed (docs/decisions.md D40).
#
# One-time setup in the repository: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy demo

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-demo.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:static
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
